<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TK-421 · Dynamic Island</title>
<style>
  /* Palette: Imperial Destroyer profile (TK421.md §24). Orbitron for the clock and labels, Geist for UI (§12). */
  :root {
    color-scheme: dark;
    --bg: #050505;
    --surface: #0c0b0d;
    --surface-alt: #1a1a21;
    --text: #e8e6e3;
    --muted: #8e8b88;
    --accent: #506a9b;
    --accent-dim: #29384f;
    --danger: #a14d55;
    --border: #3f3e44;

    --idle-w: 108px;   --idle-h: 28px;
    --media-w: 168px;
    --hud-w: 300px;    --hud-h: 44px;
    --open-w: min(748px, calc(100vw - 24px));  --open-h: 424px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --dur-open: 520ms;
    --dur-close: 340ms;
    --display: "Orbitron", "Geist", ui-sans-serif, sans-serif;
    --ui: "Geist", ui-sans-serif, system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); }
  body { font-family: var(--ui); color: var(--text); overflow: hidden; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--accent-dim); color: var(--text); }
  button { font: inherit; }

  .wall { position: fixed; inset: 0; background: url("wallpaper.jpg") center / cover no-repeat; filter: brightness(0.8); }

  /* ---------- mock of the existing bar (context only) ---------- */
  .bar { position: fixed; inset: 0 0 auto 0; height: 30px; }
  .cap {
    position: absolute; top: 4px; height: 22px; padding: 0 12px;
    display: flex; align-items: center; gap: 10px;
    background: rgba(17, 20, 24, 0.8); border: 1px solid #39414d; border-radius: 11px;
    font-size: 10px; font-weight: 600; color: #b5bac3; letter-spacing: 0.02em;
  }
  .cap.left { left: 30px; }
  .cap.right { right: 14px; gap: 12px; }
  .cap i { width: 1px; height: 12px; background: #39414d; }
  .cap svg { width: 14px; height: 14px; stroke: #b5bac3; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- the island: sizes by state (priority: open > hud > media > idle) ---------- */
  .island {
    position: fixed; top: 1px; left: 50%;
    width: var(--idle-w); height: var(--idle-h);
    transform: translateX(-50%);
    border-radius: calc(var(--idle-h) / 2);
    background: var(--surface); border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    overflow: hidden; outline: 0;
    transition: width var(--dur-close) var(--ease), height var(--dur-close) var(--ease),
                border-radius var(--dur-close) var(--ease), box-shadow var(--dur-close) ease;
  }
  .island:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .playing .island { width: var(--media-w); }
  .hud .island { width: var(--hud-w); height: var(--hud-h); border-radius: calc(var(--hud-h) / 2); }
  .open .island {
    width: var(--open-w); height: var(--open-h); border-radius: 24px;
    box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.8), 0 2px 8px rgba(0, 0, 0, 0.5);
    transition-duration: var(--dur-open);
  }

  /* ---------- clock: shared element, always centred ---------- */
  .time {
    position: absolute; left: 50%; top: 7px;
    transform: translateX(-50%) scale(0.5); transform-origin: center top;
    font-family: var(--display); font-size: 30px; line-height: 1; font-weight: 500; letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    transition: top var(--dur-close) var(--ease), transform var(--dur-close) var(--ease), opacity 200ms ease;
  }
  .open .time { top: 22px; transform: translateX(-50%) scale(1); transition-duration: var(--dur-open), var(--dur-open), 200ms; }
  .time .s { color: var(--muted); }
  .hud:not(.open) .time { opacity: 0; }

  .date {
    position: absolute; left: 24px; right: 24px; top: 62px; text-align: center;
    font-size: 14px; font-weight: 500; letter-spacing: 0.02em; color: var(--muted); white-space: nowrap;
    opacity: 0; transform: translateY(4px); transition: opacity 160ms ease, transform 160ms ease;
  }
  .open .date { opacity: 1; transform: none; transition: opacity 320ms ease 160ms, transform 420ms var(--ease) 160ms; }

  /* ---------- compact media activity (art on the left, equalizer on the right) ---------- */
  .pill-art, .eq {
    position: absolute; top: 50%; transform: translateY(-50%);
    opacity: 0; transition: opacity 200ms ease;
  }
  .pill-art { left: 8px; width: 18px; height: 18px; border-radius: 5px; overflow: hidden; border: 1px solid var(--border); }
  .pill-art svg, .art svg { display: block; width: 100%; height: 100%; }
  .eq { right: 12px; height: 12px; display: flex; align-items: flex-end; gap: 2px; }
  .eq i { width: 2px; height: 100%; background: var(--text); transform-origin: bottom; transform: scaleY(0.3); }
  .playing:not(.open):not(.hud) .pill-art, .playing:not(.open):not(.hud) .eq { opacity: 1; transition-delay: 160ms; }
  .playing .eq i { animation: eq 900ms ease-in-out infinite alternate; }
  .playing .eq i:nth-child(2) { animation-duration: 640ms; animation-delay: -200ms; }
  .playing .eq i:nth-child(3) { animation-duration: 780ms; animation-delay: -420ms; }
  .playing .eq i:nth-child(4) { animation-duration: 560ms; animation-delay: -100ms; }
  @keyframes eq { from { transform: scaleY(0.25); } to { transform: scaleY(1); } }

  /* ---------- HUD (volume / brightness) ---------- */
  .hud-content {
    position: absolute; inset: 0; display: flex; align-items: center; gap: 12px; padding: 0 18px;
    opacity: 0; transition: opacity 120ms ease; pointer-events: none;
  }
  .hud:not(.open) .hud-content { opacity: 1; transition: opacity 240ms ease 120ms; }
  .hud-content svg { width: 18px; height: 18px; flex: none; stroke: var(--text); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .hud-bar { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .hud-bar i { display: block; height: 100%; background: var(--text); border-radius: 2px; transition: width 120ms ease; }
  .hud.muted .hud-bar i { background: var(--muted); }
  .hud-val { width: 44px; text-align: right; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }

  /* ---------- expanded body ---------- */
  .body {
    position: absolute; left: 0; right: 0; top: 100px; padding: 0 28px;
    display: grid; grid-template-columns: 308px 1px 1fr; column-gap: 28px;
    opacity: 0; filter: blur(8px); transform: scale(0.97); transform-origin: top center; pointer-events: none;
    transition: opacity 140ms ease, filter 140ms ease, transform 140ms ease;
  }
  .open .body {
    opacity: 1; filter: blur(0); transform: none; pointer-events: auto;
    transition: opacity 320ms ease 140ms, filter 380ms ease 140ms, transform 520ms var(--ease) 140ms;
  }
  .divider { background: var(--border); }

  /* calendar */
  .cal-head { display: flex; align-items: center; height: 32px; }
  .month { flex: 1; font-family: var(--display); font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; }
  .nav {
    width: 28px; height: 28px; display: grid; place-items: center;
    background: transparent; color: var(--text); border: 1px solid transparent; border-radius: 8px; cursor: pointer;
    transition: border-color 140ms, background-color 140ms;
  }
  .nav svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .nav:hover { background: var(--surface-alt); border-color: var(--border); }
  .nav:focus-visible, .today-btn:focus-visible, .ctl:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .today-btn {
    margin-right: 6px; height: 28px; padding: 0 10px;
    background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
    font-family: var(--display); font-size: 11px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase;
    opacity: 0; pointer-events: none; transition: opacity 160ms, color 140ms, border-color 140ms;
  }
  .today-btn.show { opacity: 1; pointer-events: auto; }
  .today-btn:hover { color: var(--text); border-color: var(--accent); }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); margin-top: 6px; }
  .dow { height: 24px; display: grid; place-items: center; font-family: var(--display); font-size: 10px; font-weight: 500; letter-spacing: 0.12em; color: var(--muted); }
  .day {
    height: 36px; display: grid; place-items: center; position: relative;
    background: transparent; border: 0; color: var(--text); cursor: pointer;
    font: 400 13px var(--ui); font-variant-numeric: tabular-nums;
  }
  .day span { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; transition: background-color 120ms; }
  .day.out { color: var(--muted); }
  .day:hover span { background: var(--surface-alt); }
  .day:focus-visible { outline: 0; }
  .day:focus-visible span { outline: 2px solid var(--accent); }
  .day.today span { background: var(--text); color: var(--bg); font-weight: 600; }
  .day.sel:not(.today) span { box-shadow: inset 0 0 0 1px var(--accent); }
  .day.has::after { content: ""; position: absolute; bottom: 0; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); }

  /* agenda + media column */
  .side { display: flex; flex-direction: column; min-width: 0; height: 300px; }
  .ag-head { display: flex; align-items: baseline; justify-content: space-between; height: 32px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .ag-title { font-family: var(--display); font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; }
  .ag-count { font-size: 12px; color: var(--muted); }
  .events { margin-top: 4px; }
  .ev { display: grid; grid-template-columns: 50px 1fr; align-items: center; height: 44px; }
  .ev-time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ev-main { min-width: 0; }
  .ev-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev-title::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 8px; vertical-align: 1px; border-radius: 50%; background: var(--accent); }
  .ev.allday .ev-title::before { background: transparent; box-shadow: inset 0 0 0 1px var(--muted); }
  .ev-sub { margin-top: 1px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .none { padding-top: 14px; font-size: 13px; color: var(--muted); }

  .media {
    margin-top: auto; height: 76px; display: none; align-items: center; gap: 12px;
    padding-top: 12px; border-top: 1px solid var(--border);
  }
  .has-media .media { display: flex; }
  .art { flex: none; width: 52px; height: 52px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
  .m-info { flex: 1; min-width: 0; }
  .m-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-artist { margin-top: 1px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-bar { margin-top: 8px; height: 3px; background: var(--border); }
  .m-bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  .m-ctl { display: flex; gap: 4px; }
  .ctl {
    width: 32px; height: 32px; display: grid; place-items: center; cursor: pointer;
    background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    transition: border-color 140ms;
  }
  .ctl svg { width: 14px; height: 14px; fill: currentColor; }
  .ctl:hover { border-color: var(--accent); }
  .ctl.main { background: var(--text); color: var(--bg); border-color: var(--text); }
  .ctl.main .i-pause { display: none; }
  .playing .ctl.main .i-pause { display: block; }
  .playing .ctl.main .i-play { display: none; }

  .hint { position: fixed; left: 16px; right: 16px; bottom: 14px; text-align: center; font-size: 12px; color: rgba(232, 230, 227, 0.7); }
  .hint kbd { font: inherit; color: var(--text); }

  @media (max-width: 760px) { .cap.left, .cap.right, .divider, .side { display: none; } .body { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 1ms !important; transition-delay: 0ms !important; animation: none !important; }
  }
</style>
</head>
<body id="root" class="has-media playing">

<div class="wall"></div>

<div class="bar" aria-hidden="true">
  <div class="cap left"><span>CPU 6%</span><i></i><span>RAM 26%</span><i></i><span>GPU 26%</span></div>
  <div class="cap right">
    <svg viewBox="0 0 24 24"><path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r=".6"/></svg>
    <svg viewBox="0 0 24 24"><path d="M7 7l10 10-5 4V3l5 4L7 17"/></svg>
    <svg viewBox="0 0 24 24"><path d="M4 9.5v5h4l5 4v-13l-5 4zM16.5 9a4 4 0 0 1 0 6"/></svg>
    <svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4"/></svg>
    <svg viewBox="0 0 24 24"><path d="M12 3v8M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
  </div>
</div>

<div class="island" id="island" tabindex="0" role="button" aria-expanded="false" aria-label="Clock, calendar and agenda">
  <div class="pill-art" id="pillArt" aria-hidden="true"></div>
  <div class="time" id="time">00:00<span class="s">:00</span></div>
  <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <div class="hud-content" id="hudContent" aria-live="polite"></div>

  <div class="date" id="date"></div>

  <div class="body">
    <section aria-label="Calendar">
      <div class="cal-head">
        <div class="month" id="month"></div>
        <button class="today-btn" id="todayBtn" type="button">Today</button>
        <button class="nav" id="prev" type="button" aria-label="Previous month"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="nav" id="next" type="button" aria-label="Next month"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <div class="divider" aria-hidden="true"></div>

    <section class="side" aria-label="Agenda and media">
      <div class="ag-head"><div class="ag-title" id="agTitle">Today</div><div class="ag-count" id="agCount"></div></div>
      <div class="events" id="events"></div>

      <div class="media" id="media">
        <div class="art" id="art" aria-hidden="true"></div>
        <div class="m-info">
          <div class="m-title">The Imperial March</div>
          <div class="m-artist">John Williams · Spotify</div>
          <div class="m-bar"><i id="mFill"></i></div>
        </div>
        <div class="m-ctl">
          <button class="ctl" id="mPrev" type="button" aria-label="Previous track"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg></button>
          <button class="ctl main" id="mPlay" type="button" aria-label="Play or pause">
            <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15L19.5 12z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><path d="M6.5 5h4v14h-4zM13.5 5h4v14h-4z"/></svg>
          </button>
          <button class="ctl" id="mNext" type="button" aria-label="Next track"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg></button>
        </div>
      </div>
    </section>
  </div>
</div>

<p class="hint">Prototype · hover the clock · <kbd>↑</kbd><kbd>↓</kbd> volume · <kbd>←</kbd><kbd>→</kbd> brightness · <kbd>M</kbd> mute · <kbd>P</kbd> play/pause · <kbd>S</kbd> stop media · events and track are mock data</p>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const root = document.body, island = $('island');
  const pad = n => String(n).padStart(2, '0');
  let view = new Date(), selected = new Date(), closeTimer = null, hudTimer = null;

  /* ---- clock + date ---- */
  function tick() {
    const n = new Date();
    $('time').innerHTML = `${pad(n.getHours())}:${pad(n.getMinutes())}<span class="s">:${pad(n.getSeconds())}</span>`;
    $('date').textContent = n.toLocaleDateString('en-US', { weekday: 'long' }) + ', ' + n.getDate() + ' ' + n.toLocaleDateString('en-US', { month: 'long' });
  }
  tick(); setInterval(tick, 1000);

  /* ---- mock events (relative to today so the prototype is always populated) ---- */
  const HOLIDAYS = { '10-12': 'Nossa Senhora Aparecida', '11-02': 'Finados', '11-15': 'Proclamação da República', '12-25': 'Natal', '01-01': 'Confraternização Universal' };
  const BY_OFFSET = {
    0: [['10:00', 'Daily', 'Google Meet · 30 min'], ['14:30', 'Dentista', 'Clínica Centro · 1 h'], ['19:00', 'Treino', 'Academia · 1 h']],
    1: [['09:00', 'Review da sprint', 'Google Meet · 1 h']],
    3: [['13:00', 'Almoço com cliente', 'Restaurante · 1 h 30'], ['16:00', 'Planning', 'Google Meet · 2 h']],
    4: [['11:00', 'Entrevista', 'Google Meet · 45 min']],
    6: [['08:30', 'Voo para SP', 'Aeroporto · 2 h']],
    9: [['15:00', 'Retro', 'Google Meet · 1 h']],
  };
  const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  function eventsOn(d) {
    const out = [], key = pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    if (HOLIDAYS[key]) out.push({ allday: true, time: 'All day', title: HOLIDAYS[key], sub: 'Holiday' });
    const off = Math.round((startOfDay(d) - startOfDay(new Date())) / 864e5);
    (BY_OFFSET[off] || []).forEach(([t, title, sub]) => out.push({ time: t, title, sub }));
    return out;
  }

  /* ---- calendar ---- */
  const WEEKDAYS = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];   // Sunday-first (Brazil)
  function renderCal() {
    const y = view.getFullYear(), m = view.getMonth(), today = new Date();
    $('month').textContent = view.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    const first = new Date(y, m, 1), start = new Date(y, m, 1 - first.getDay());
    let html = WEEKDAYS.map(d => `<div class="dow">${d}</div>`).join('');
    for (let i = 0; i < 42; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const cls = ['day', d.getMonth() !== m && 'out', d.toDateString() === today.toDateString() && 'today',
                   d.toDateString() === selected.toDateString() && 'sel', eventsOn(d).length && 'has'].filter(Boolean).join(' ');
      html += `<button class="${cls}" type="button" data-t="${d.getTime()}" aria-label="${d.toDateString()}"><span>${d.getDate()}</span></button>`;
    }
    $('grid').innerHTML = html;
    $('todayBtn').classList.toggle('show', y !== today.getFullYear() || m !== today.getMonth());
  }

  /* ---- agenda for the selected day ---- */
  function renderAgenda() {
    const isToday = selected.toDateString() === new Date().toDateString();
    $('agTitle').textContent = isToday ? 'Today' : selected.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short' });
    const list = eventsOn(selected), rows = root.classList.contains('has-media') ? 3 : 5;
    $('agCount').textContent = list.length ? list.length + (list.length === 1 ? ' event' : ' events') : '';
    $('events').innerHTML = list.length
      ? list.slice(0, rows).map(e => `<div class="ev${e.allday ? ' allday' : ''}"><div class="ev-time">${e.allday ? 'All day' : e.time}</div><div class="ev-main"><div class="ev-title">${e.title}</div><div class="ev-sub">${e.sub}</div></div></div>`).join('')
        + (list.length > rows ? `<div class="none">+${list.length - rows} more</div>` : '')
      : '<div class="none">No events</div>';
  }

  $('grid').addEventListener('click', e => {
    const b = e.target.closest('.day'); if (!b) return;
    selected = new Date(+b.dataset.t); renderCal(); renderAgenda();
  });
  $('prev').addEventListener('click', () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); renderCal(); });
  $('next').addEventListener('click', () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); renderCal(); });
  $('todayBtn').addEventListener('click', () => { view = new Date(); selected = new Date(); renderCal(); renderAgenda(); });

  /* ---- media (mock) ---- */
  const ART = `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="#0c0b0d"/><g fill="#a14d55"><path d="M-10 70 70 -10l8 0L-10 78z" opacity=".9"/><path d="M-10 86 86 -10l6 0L-10 92z" opacity=".55"/><path d="M10 110 110 10l0 8L18 110z" opacity=".35"/></g><rect x="14" y="62" width="44" height="1.5" fill="#e8e6e3" opacity=".7"/></svg>`;
  $('art').innerHTML = ART; $('pillArt').innerHTML = ART;
  let pos = 72;
  const DUR = 186;
  setInterval(() => { if (root.classList.contains('playing')) { pos = (pos + 1) % DUR; $('mFill').style.width = (pos / DUR * 100) + '%'; } }, 1000);
  $('mFill').style.width = (pos / DUR * 100) + '%';
  const setPlaying = v => root.classList.toggle('playing', v);
  $('mPlay').addEventListener('click', () => setPlaying(!root.classList.contains('playing')));
  $('mNext').addEventListener('click', () => { pos = 0; });
  $('mPrev').addEventListener('click', () => { pos = 0; });
  function setMedia(v) { root.classList.toggle('has-media', v); if (!v) setPlaying(false); renderAgenda(); }

  /* ---- HUD: volume / brightness ---- */
  let volume = 45, muted = false, brightness = 70;
  const ICON = {
    vol: '<svg viewBox="0 0 24 24"><path d="M4 9.5v5h4l5 4v-13l-5 4zM16.5 9a4 4 0 0 1 0 6"/></svg>',
    mute: '<svg viewBox="0 0 24 24"><path d="M4 9.5v5h4l5 4v-13l-5 4zM17 9.5l4 5M21 9.5l-4 5"/></svg>',
    sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.6"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/></svg>',
  };
  function showHud(kind) {
    const isVol = kind === 'vol', val = isVol ? (muted ? 0 : volume) : brightness;
    root.classList.toggle('muted', isVol && muted);
    $('hudContent').innerHTML = `${isVol ? (muted || volume === 0 ? ICON.mute : ICON.vol) : ICON.sun}<div class="hud-bar"><i style="width:${val}%"></i></div><div class="hud-val">${isVol && muted ? 'Muted' : val + '%'}</div>`;
    root.classList.add('hud');
    clearTimeout(hudTimer);
    hudTimer = setTimeout(() => root.classList.remove('hud'), 1600);
  }
  const clamp = v => Math.max(0, Math.min(100, v));
  addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (k === 'ArrowUp' || k === 'ArrowDown') { e.preventDefault(); muted = false; volume = clamp(volume + (k === 'ArrowUp' ? 5 : -5)); showHud('vol'); }
    else if (k === 'ArrowLeft' || k === 'ArrowRight') { e.preventDefault(); brightness = clamp(brightness + (k === 'ArrowRight' ? 5 : -5)); showHud('sun'); }
    else if (k === 'm' || k === 'M') { muted = !muted; showHud('vol'); }
    else if (k === 'p' || k === 'P') { if (!root.classList.contains('has-media')) setMedia(true); setPlaying(!root.classList.contains('playing')); }
    else if (k === 's' || k === 'S') setMedia(false);
  });

  /* ---- hover / focus open-close ---- */
  function setOpen(v) {
    root.classList.toggle('open', v);
    island.setAttribute('aria-expanded', v);
    if (v) { root.classList.remove('hud'); }
    else { view = new Date(); selected = new Date(); renderCal(); renderAgenda(); }
  }
  island.addEventListener('pointerenter', () => { clearTimeout(closeTimer); setOpen(true); });
  island.addEventListener('pointerleave', () => { closeTimer = setTimeout(() => setOpen(false), 180); });
  island.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setOpen(!root.classList.contains('open')); }
    if (e.key === 'Escape') setOpen(false);
  });

  renderCal(); renderAgenda();

  const h = location.hash;                                  // static states for screenshots
  if (h === '#open' || h === '#open-nomedia') {
    document.documentElement.style.setProperty('--dur-open', '1ms');
    if (h === '#open-nomedia') setMedia(false);
    setOpen(true);
  } else if (h === '#hud') { document.documentElement.style.setProperty('--dur-close', '1ms'); showHud('vol'); }
  else if (h === '#idle') { document.documentElement.style.setProperty('--dur-close', '1ms'); }
})();
</script>
