<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TK-421 · Keyboard dropdown</title>
<!--
  Prototype of the KEYBOARD dropdown: a button next to the Claude usage chip (top right of the toolbar capsule) opens a
  panel for the Basike Ba-KEY391 (258a:019d): lighting effect, brightness, speed, colour, the side glow and the screen
  shown at boot. Every control here is real in the keyboard (see ba-key391/led_catalog.md in the basike-keyboard project):
    effect (cfg byte 10, 18 effects), brightness (7 steps 0..24), speed (0..4), colour (0..6 palette, 7 rainbow),
    side glow mode (byte 13, 5 presets) and level (byte 15, 0..4), boot screen (byte 51, 1 home / 2 GIF).
  The figure is drawn with the iso-glow technique (isometric hairlines, light only on what is live). The projection kernel
  and the face vocabulary below are adapted from iso-glow by April Zhu, itself based on iso-figure by Tolga Cohce (both MIT).
  Palette: Imperial Destroyer profile (tk421/TK421.md section 24); the LED colours in the figure are the keyboard's own.
  Nothing here talks to the keyboard: it is a mock with the same options as the real device.
-->
<style>
  :root {
    color-scheme: dark;
    --bg: #050505; --surface: #0c0b0d; --surface-alt: #1a1a21;
    --text: #e8e6e3; --muted: #8e8b88; --accent: #506a9b; --accent-dim: #29384f;
    --danger: #a14d55; --border: #3f3e44;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --display: "Orbitron", "Geist", ui-sans-serif, sans-serif;
    --ui: "Geist", ui-sans-serif, system-ui, sans-serif;
    --mono: "Monaspace Neon", ui-monospace, monospace;

    /* iso-glow face tokens, graphite instead of its light/dark pair */
    --body: #111115; --deck: #16161b; --line: #5d5c64; --detail: #2a2a31; --recess: #0a0a0d; --ink: #8e8b88;
    --led: #ff2d2d;     /* the keyboard's current colour, set by the script */
    --side: #ffffff;    /* the side glow colour, set by the script */
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); }
  body { font-family: var(--ui); color: var(--text); overflow: hidden; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  svg { display: block; }
  .wall { position: fixed; inset: 0; background: url("../toolbar/wallpaper.jpg") center / cover no-repeat; filter: brightness(0.8); }

  /* ---------- mock of the toolbar capsule (context only) ---------- */
  .cap {
    position: fixed; top: 4px; right: 30px; height: 28px; padding: 0 5px; gap: 2px;
    display: flex; align-items: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  }
  .tb {
    position: relative; height: 22px; min-width: 24px; padding: 0 5px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: transparent; border: 0; border-radius: 8px; color: #b5bac3; cursor: default;
    transition: color 140ms, background-color 140ms;
  }
  .tb svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  button.tb { cursor: pointer; }
  button.tb:hover, button.tb[aria-expanded="true"] { color: var(--text); background: var(--surface-alt); }
  button.tb:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .usage { padding: 0 8px; }
  .usage .pct { font: 500 10px/14px var(--display); letter-spacing: 0.4px; color: var(--text); position: relative; top: 1px; }
  .usage .meter { width: 38px; height: 3px; border-radius: 2px; background: var(--surface-alt); overflow: hidden; }
  .usage .meter i { display: block; width: 62%; height: 100%; background: var(--muted); }
  .usage .spark { fill: currentColor; stroke: none; }

  /* ---------- the dropdown ---------- */
  .panel {
    position: fixed; top: 40px; right: 30px; width: 340px;
    background: rgba(12, 11, 13, 0.72); border: 1px solid var(--border); border-radius: 20px;
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    transform-origin: top right; transition: opacity 200ms, transform 320ms var(--ease);
  }
  .panel[hidden-state="true"] { opacity: 0; transform: scale(0.97); pointer-events: none; }
  .inner { padding: 14px 14px 12px; display: grid; gap: 12px; }

  .head { display: flex; align-items: center; justify-content: space-between; }
  .title { font: 500 11px/1 var(--display); letter-spacing: 1.6px; }
  .link { display: inline-flex; align-items: center; gap: 6px; font: 500 9px/1 var(--display); letter-spacing: 1.2px; color: var(--muted); }
  .link i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); }

  /* the figure */
  .fig { border: 1px solid var(--border); border-radius: 14px; background: radial-gradient(ellipse 60% 55% at 50% 55%, rgba(80, 106, 155, 0.10), transparent 75%), var(--surface); padding: 4px 4px 0; }
  #stage { width: 100%; height: auto; display: block; user-select: none; }
  .face { fill: var(--body); stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .face.top { fill: var(--deck); }
  .face.recess { fill: var(--recess); }
  .detail { fill: none; stroke: var(--detail); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .keytop { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .keyside { fill: #0d0d10; stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .label { fill: var(--ink); font-family: var(--mono); }
  .cap-line { display: flex; justify-content: space-between; padding: 4px 10px 6px; font: 500 9px/1 var(--display); letter-spacing: 1.2px; color: var(--muted); text-transform: uppercase; }
  .cap-line b { color: var(--text); font-weight: 500; }

  /* sections */
  .sec { display: grid; gap: 9px; }
  .sec > h3 { font: 500 9px/1 var(--display); letter-spacing: 1.6px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .sec > h3::after { content: ""; flex: 1; height: 1px; background: var(--border); opacity: 0.6; }
  .row { display: grid; grid-template-columns: 84px 1fr; align-items: center; gap: 10px; min-height: 24px; }
  .row > label { font: 500 9px/1 var(--display); letter-spacing: 1.2px; color: var(--muted); text-transform: uppercase; }
  .row[aria-disabled="true"] { opacity: 0.35; pointer-events: none; }

  .seg { display: flex; gap: 3px; }
  .seg button {
    flex: 1; height: 22px; border: 1px solid var(--border); border-radius: 4px; background: transparent;
    font: 500 9px/1 var(--display); letter-spacing: 0.8px; color: var(--muted); cursor: pointer; padding: 0 2px;
    transition: color 140ms, background-color 140ms, border-color 140ms;
  }
  .seg button:hover { color: var(--text); background: var(--surface-alt); }
  .seg button[aria-pressed="true"] { color: var(--text); background: var(--accent-dim); border-color: var(--accent); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .steps button { height: 14px; padding: 0; }
  .steps button[data-on="true"] { background: var(--accent); border-color: var(--accent); }
  .steps button[aria-pressed="true"] { background: var(--accent); border-color: var(--text); }

  .sw { display: flex; gap: 5px; }
  .sw button { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border); background: none; padding: 3px; cursor: pointer; }
  .sw button i { display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--c); }
  .sw button[aria-pressed="true"] { border-color: var(--text); box-shadow: 0 0 8px -1px var(--c); }
  .sw button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .sw .rb i { background: conic-gradient(#ff2d2d, #ffe02d, #2dff5a, #2de0ff, #2d5bff, #b02dff, #ff2d2d); }

  /* effect picker */
  .fx { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px;  }
  .fx button {
    height: 24px; border: 1px solid var(--border); border-radius: 4px; background: transparent; cursor: pointer;
    font: 500 9px/1 var(--ui); letter-spacing: 0.2px; color: var(--muted); padding: 0 4px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    transition: color 140ms, background-color 140ms, border-color 140ms;
  }
  .fx button:hover { color: var(--text); background: var(--surface-alt); }
  .fx button[aria-pressed="true"] { color: var(--text); background: var(--accent-dim); border-color: var(--accent); }
  .fx button em { font-style: normal; color: var(--muted); margin-right: 5px; font-family: var(--display); font-size: 8px; }
  .fx button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .foot { font: 400 9px/1.4 var(--mono); color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .foot b { color: var(--text); font-weight: 400; }
  @media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
</style>
</head>
<body>
<div class="wall"></div>

<!-- context: the right-hand capsule of the toolbar, with the new button next to the Claude chip -->
<div class="cap" aria-hidden="false">
  <button class="tb usage" type="button" tabindex="-1" aria-label="Claude usage">
    <svg viewBox="0 0 24 24" class="spark"><path d="M12 1l2.2 8.8L23 12l-8.8 2.2L12 23l-2.2-8.8L1 12l8.8-2.2z"/></svg>
    <span class="pct">62%</span><span class="meter"><i></i></span>
  </button>
  <button class="tb" id="kbBtn" type="button" aria-label="Keyboard" aria-expanded="true">
    <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
  </button>
  <span class="tb"><svg viewBox="0 0 24 24"><path d="M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0M12 19h.01"/></svg></span>
  <span class="tb"><svg viewBox="0 0 24 24"><path d="M7 7l10 10-5 4V3l5 4L7 17"/></svg></span>
  <span class="tb"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6"/></svg></span>
  <span class="tb"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
  <span class="tb"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/></svg></span>
  <span class="tb"><svg viewBox="0 0 24 24"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></svg></span>
</div>

<section class="panel" id="panel" role="dialog" aria-label="Keyboard">
  <div class="inner">
    <div class="head">
      <span class="title">BA-KEY391</span>
      <span class="link"><i></i>USB · CABLE</span>
    </div>

    <div class="fig">
      <svg id="stage" role="img" aria-label="Isometric drawing of the keyboard; the lit parts follow the settings below"></svg>
      <div class="cap-line"><span id="figEffect">—</span><b id="figState">—</b></div>
    </div>

    <div class="sec">
      <h3>LIGHTING</h3>
      <div class="fx" id="fx" role="group" aria-label="Effect"></div>
      <div class="row" id="rowBright"><label>Brightness</label><div class="seg steps" id="bright" role="group" aria-label="Brightness"></div></div>
      <div class="row" id="rowSpeed"><label>Speed</label><div class="seg steps" id="speed" role="group" aria-label="Speed"></div></div>
      <div class="row" id="rowColor"><label>Colour</label><div class="sw" id="color" role="group" aria-label="Colour"></div></div>
    </div>

    <div class="sec">
      <h3>SIDE GLOW</h3>
      <div class="row"><label>Mode</label><div class="seg" id="sideMode" role="group" aria-label="Side glow mode"></div></div>
      <div class="row" id="rowSideLevel"><label>Level</label><div class="seg steps" id="sideLevel" role="group" aria-label="Side glow level"></div></div>
    </div>

    <div class="sec">
      <h3>DISPLAY</h3>
      <div class="row"><label>Boot screen</label><div class="seg" id="boot" role="group" aria-label="Screen shown at boot"></div></div>
    </div>

    <div class="foot"><span id="readout">—</span><span><b>SYNCED</b></span></div>
  </div>
</section>

<script>
/* ---------------- isometric kernel (adapted from iso-glow / iso-figure, MIT) ---------------- */
const ISO = (() => {
  const C = Math.cos(Math.PI / 6), S = Math.sin(Math.PI / 6);
  function kernel(OX, OY) {
    const P = (x, y, z) => [(x - y) * C + OX, (x + y) * S - z + OY];
    const D = (x, y, z) => [(x - y) * C, (x + y) * S - z];
    const plane = (O, U, V) => { const o = P(...O), u = D(...U), v = D(...V);
      return `matrix(${u[0]} ${u[1]} ${v[0]} ${v[1]} ${o[0]} ${o[1]})`; };
    const TOP = (x, y, z) => plane([x, y, z], [1, 0, 0], [0, 1, 0]);
    const FRONT = (x, y, z) => plane([x, y, z], [1, 0, 0], [0, 0, -1]);
    const SIDE = (x, y, z) => plane([x, y, z], [0, -1, 0], [0, 0, -1]);
    const rect = (t, w, h, r = 0, cls = 'face') => `<g transform="${t}"><rect class="${cls}" width="${w}" height="${h}" rx="${r}"/></g>`;
    const box = (x, y, z, w, d, h) =>
      rect(SIDE(x + w, y + d, z + h), d, h) + rect(FRONT(x, y + d, z + h), w, h) + rect(TOP(x, y, z + h), w, d, 0, 'face top');
    return { P, D, plane, TOP, FRONT, SIDE, rect, box };
  }
  function frame(points, margin = 0.03, aspect = 1.6) {
    const d = points.map(([x, y, z]) => [(x - y) * C, (x + y) * S - z]);
    let x0 = Math.min(...d.map(p => p[0])), x1 = Math.max(...d.map(p => p[0]));
    let y0 = Math.min(...d.map(p => p[1])), y1 = Math.max(...d.map(p => p[1]));
    const m = margin * Math.max(x1 - x0, y1 - y0);
    let w = x1 - x0 + 2 * m, h = y1 - y0 + 2 * m, ox = m - x0, oy = m - y0;
    if (w / h < aspect) { const nw = h * aspect; ox += (nw - w) / 2; w = nw; }
    else { const nh = w / aspect; oy += (nh - h) / 2; h = nh; }
    return { ...kernel(ox, oy), viewBox: `0 0 ${w.toFixed(1)} ${h.toFixed(1)}`, W: w, H: h };
  }
  return { frame };
})();

/* ---------------- what the keyboard really offers (ba-key391/led_catalog.json) ---------------- */
const EFFECTS = [
  // hw, name, family, hasSpeed, hasColor
  [1,  'Fixed',          'static',   false, true ],
  [2,  'Rainbow',        'hueWave',  true,  true ],
  [3,  'Respire',        'breathe',  true,  false],
  [4,  'Game mode',      'perkey',   true,  true ],
  [5,  'Windmill',       'spin',     true,  true ],
  [6,  'Sine wave',      'wave',     true,  true ],
  [7,  'Off',            'off',      true,  true ],
  [8,  'Waterfall',      'waterfall',true,  true ],
  [9,  'Storm',          'spin',     true,  true ],
  [10, 'Raindrops',      'rain',     true,  true ],
  [11, 'Ripples',        'ripple',   true,  true ],
  [12, 'Blossoming',     'bloom',    true,  true ],
  [13, 'Reaction',       'reaction', true,  true ],
  [14, 'Stars',          'twinkle',  true,  true ],
  [15, 'Effect 28',      'wave',     true,  false],
  [16, 'Effect 30',      'hueWave',  true,  false],
  [17, 'Scanning',       'scan',     true,  false],
  [18, 'Effect 29',      'waterfall',true,  true ],
];
const COLORS = [['Red', '#ff2d2d'], ['Green', '#2dff5a'], ['Blue', '#2d5bff'], ['Yellow', '#ffe02d'],
                ['Purple', '#b02dff'], ['Cyan', '#2de0ff'], ['White', '#ffffff']];
const SIDE_MODES = ['OFF', 'RAINBOW', 'CYCLE', 'WHITE', 'PULSE'];
const BRIGHT_STEPS = 7, SPEED_STEPS = 5, SIDE_STEPS = 5;

const st = { effect: 15, bright: 5, speed: 4, color: 7, sideMode: 3, sideLevel: 4, boot: 2 };   // the keyboard's state when this was drawn
const $ = id => document.getElementById(id);
const effOf = hw => EFFECTS.find(e => e[0] === hw);

/* ---------------- the figure ---------------- */
const W = 372, Dp = 106, BASE = 10, KEYH = 5;
const K = ISO.frame([[0, 0, 0], [W, 0, 0], [0, Dp, 0], [W, Dp, 0], [W, 0, BASE + KEYH + 6]]);
const { TOP, FRONT, SIDE, rect, box } = K;
const stage = $('stage');

// keys: [x, y, w, d]
const keys = [];
for (let c = 0; c < 15; c++) keys.push([12 + c * 17, 12, 15, 11]);                 // function row
for (let r = 0; r < 4; r++) {                                                       // main block
  if (r < 3) for (let c = 0; c < 15; c++) keys.push([12 + c * 17, 28 + r * 17, 15, 14]);
}
[[12, 22], [36, 22], [60, 22], [84, 96], [184, 18], [204, 18], [224, 18]].forEach(([x, w]) => keys.push([x, 79, w, 14]));   // bottom row
for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) keys.push([284 + c * 17, 28 + r * 17, 15, 14]);   // numpad
// paint order: back to front
keys.sort((a, b) => (a[0] + a[1]) - (b[0] + b[1]));

let svg = box(0, 0, 0, W, Dp, BASE);
svg += `<g transform="${TOP(0, 0, BASE)}"><rect class="detail" x="5" y="5" width="${W - 10}" height="${Dp - 10}" rx="4"/></g>`;

// side glow strips on the two visible walls (segments, so a rainbow can run along them)
const SEG_F = 28, SEG_S = 10;
let sideSegs = '';
for (let i = 0; i < SEG_F; i++) sideSegs += `<g transform="${FRONT(i * W / SEG_F, Dp, 6)}"><rect class="seg-f" width="${W / SEG_F + 0.6}" height="2.6"/></g>`;
for (let i = 0; i < SEG_S; i++) sideSegs += `<g transform="${SIDE(W, Dp - i * Dp / SEG_S, 6)}"><rect class="seg-s" width="${Dp / SEG_S + 0.6}" height="2.6"/></g>`;
svg += `<g id="sideBloom" filter="url(#blur)" opacity="0.8">${sideSegs.replace(/class="seg-f"/g, 'class="bf"').replace(/class="seg-s"/g, 'class="bs"')}</g>`;
svg += `<g id="sideCore">${sideSegs}</g>`;

// the screen (recess + lit content) and the knob
svg += `<g transform="${TOP(286, 7, BASE)}"><rect class="face recess" width="58" height="19" rx="2"/></g>`;
svg += `<g transform="${TOP(288, 9, BASE)}"><rect id="scrBg" width="54" height="15" rx="1" fill="#05070b"/><g id="scr" clip-path="url(#scrClip)"></g></g>`;
svg += `<g transform="${TOP(359, 16, BASE)}"><circle r="10.5" fill="none" stroke="var(--side)" stroke-width="2" id="ring" opacity="0.9"/></g>`;
svg += `<g id="ringBloom" transform="${TOP(359, 16, BASE)}" filter="url(#blur)"><circle r="10.5" fill="none" stroke="var(--side)" stroke-width="3" opacity="0.8"/></g>`;
svg += `<g transform="${TOP(359, 16, BASE + 3)}"><circle r="8" class="face top"/><circle r="8" fill="none" class="detail"/><path d="M0 -6 V-2" stroke="var(--ink)" stroke-width="1.4" stroke-linecap="round" fill="none"/></g>`;

// bloom underlay for the keys (one blurred copy, drawn before the caps)
let bloom = '', caps = '';
keys.forEach(([x, y, w, d], i) => {
  const z = BASE;
  bloom += `<g transform="${TOP(x, y, z + KEYH)}"><rect id="kb${i}" width="${w}" height="${d}" rx="2" fill="var(--led)" opacity="0"/></g>`;
  caps += rect(SIDE(x + w, y + d, z + KEYH), d, KEYH, 0, 'keyside') + rect(FRONT(x, y + d, z + KEYH), w, KEYH, 0, 'keyside') +
    `<g transform="${TOP(x, y, z + KEYH)}"><rect id="kt${i}" class="keytop" width="${w}" height="${d}" rx="2" fill="#17171c"/></g>`;
});
svg += `<g filter="url(#blur)" id="keyBloom">${bloom}</g>` + caps;

const defs = `<defs>
  <filter id="blur" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000"><feGaussianBlur stdDeviation="3.2"/></filter>
  <clipPath id="scrClip"><rect width="54" height="15"/></clipPath>
</defs>`;
stage.setAttribute('viewBox', K.viewBox);
stage.innerHTML = defs + svg;

const kt = keys.map((_, i) => $('kt' + i)), kb = keys.map((_, i) => $('kb' + i));
const sideCore = [...$('sideCore').querySelectorAll('rect')], sideBloom = [...$('sideBloom').querySelectorAll('rect')];
const scrG = $('scr'), ring = $('ring'), ringBloom = $('ringBloom').querySelector('circle');
const kpos = keys.map(([x, y, w, d]) => [(x + w / 2) / W, (y + d / 2) / Dp]);
const hash = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const wasd = new Set(keys.map((k, i) => [i, k]).filter(([, k]) => k[1] >= 28 && k[1] <= 62 && k[0] >= 46 && k[0] <= 96).map(([i]) => i));

/* ---------------- light ---------------- */
const hsl = (h, l = 58) => `hsl(${((h % 360) + 360) % 360} 100% ${l}%)`;
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * Math.max(0, Math.min(1, t))));
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const BODY = [23, 23, 28];
function hueToRgb(h) {
  const a = ((h % 360) + 360) % 360 / 60, f = a - Math.floor(a), q = 1 - f, i = Math.floor(a) % 6;
  const [r, g, b] = [[1, f, 0], [q, 1, 0], [0, 1, f], [0, q, 1], [f, 0, 1], [1, 0, q]][i];
  return [r, g, b].map(v => Math.round(40 + v * 215));
}

// returns [amp 0..1, hue or null]; null = the chosen colour
function sample(family, i, t, sp) {
  const [nx, ny] = kpos[i];
  switch (family) {
    case 'off': return [0, null];
    case 'static': return [1, null];
    case 'breathe': return [0.12 + 0.88 * (0.5 + 0.5 * Math.sin(t * 1.6 * sp)), (t * 25) % 360];
    case 'hueWave': return [1, (nx * 360 + t * 70 * sp) % 360];
    case 'wave': return [0.5 + 0.5 * Math.sin(nx * 7 - t * 2.4 * sp), null];
    case 'waterfall': return [1, (ny * 200 + nx * 60 + t * 90 * sp) % 360];
    case 'spin': return [1, (Math.atan2(ny - 0.5, nx - 0.5) * 57.3 + t * 100 * sp) % 360];
    case 'rain': { const p = (t * 0.55 * sp + hash(i)) % 1; return [Math.max(0.05, 1 - p * 3.2), null]; }
    case 'ripple': { const d = Math.hypot((nx - 0.5) * 1.8, ny - 0.5); return [Math.max(0.08, Math.sin(d * 16 - t * 4 * sp)), null]; }
    case 'bloom': { const d = Math.hypot((nx - 0.5) * 1.8, ny - 0.5); return [Math.sin(t * 2 * sp - d * 9) > 0.15 ? 1 : 0.2, (d * 300 + t * 40) % 360]; }
    case 'reaction': { const p = (t * 0.9 * sp + hash(i) * 7) % 7; return [p < 0.9 ? 1 - p / 0.9 * 0.85 : 0.1, null]; }
    case 'twinkle': return [0.08 + 0.92 * Math.pow(Math.max(0, Math.sin(t * 1.6 * sp + hash(i) * 40)), 8), null];
    case 'scan': { const pos = (t * 0.35 * sp) % 1.5 - 0.25; return [Math.max(0.06, 1 - Math.abs(nx - pos) * 7), null]; }
    case 'perkey': return [wasd.has(i) ? 1 : 0.07, null];
  }
  return [1, null];
}

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let t0 = performance.now();
function frame(now) {
  const t = reduce ? 0 : (now - t0) / 1000;
  const eff = effOf(st.effect), family = eff[2];
  const sp = eff[3] ? 0.35 + st.speed * 0.4 : 0.8;
  const bri = st.bright / (BRIGHT_STEPS - 1);
  const base = hex(COLORS[Math.min(st.color, 6)][1]);
  for (let i = 0; i < keys.length; i++) {
    const [amp, hue] = sample(family, i, t, sp);
    let rgb;
    if (eff[4] && st.color !== 7) rgb = base;                      // a chosen colour paints the effect
    else if (hue !== null) rgb = hueToRgb(hue);                    // the effect's own colours
    else rgb = hueToRgb(t * 50 * sp + kpos[i][0] * 360);           // rainbow for the single-hue effects
    const a = amp * bri;
    kt[i].style.fill = `rgb(${mix(BODY, rgb, a * 0.95).join(',')})`;
    kb[i].setAttribute('fill', `rgb(${rgb.join(',')})`);
    kb[i].setAttribute('opacity', (a * 0.9).toFixed(3));
  }
  document.documentElement.style.setProperty('--led', st.color === 7 ? hsl(t * 60) : COLORS[st.color][1]);

  // side glow
  const lvl = st.sideLevel / (SIDE_STEPS - 1), m = st.sideMode;
  let sideCol = '#ffffff';
  const nF = sideCore.length;
  for (let i = 0; i < nF; i++) {
    let c = '#fff', o = 0;
    const along = i < SEG_F ? i / SEG_F : 0.9 + (i - SEG_F) / SEG_S * 0.1;
    if (m === 1) { c = hsl(along * 360 + t * 90); o = 1; }
    else if (m === 2) { c = hsl(t * 40); o = 1; }
    else if (m === 3) { c = '#ffffff'; o = 1; }
    else if (m === 4) { c = '#ffffff'; o = 0.5 + 0.5 * Math.sin(t * 6) > 0.5 ? 1 : 0.08; }
    o *= lvl;
    sideCore[i].style.fill = c; sideCore[i].style.opacity = String(m === 0 ? 0.06 : 0.1 + o * 0.9);
    sideBloom[i].style.fill = c; sideBloom[i].style.opacity = String(m === 0 ? 0 : o);
    if (i === 0) sideCol = c;
  }
  document.documentElement.style.setProperty('--side', m === 0 ? '#3a3a42' : sideCol);
  ring.setAttribute('opacity', m === 0 ? 0.5 : 0.35 + lvl * 0.65);
  ringBloom.setAttribute('opacity', m === 0 ? 0 : lvl * 0.9);

  // the screen
  scrG.innerHTML = '';
  if (st.boot === 2) {
    let s = '';
    for (let b = 0; b < 9; b++) {
      const h = 3 + 9 * Math.abs(Math.sin(t * 2.2 + b * 0.7));
      s += `<rect x="${3 + b * 5.6}" y="${15 - h - 1}" width="4" height="${h}" fill="${hsl(200 + b * 14 + t * 30, 50)}"/>`;
    }
    scrG.innerHTML = s;
  } else {
    scrG.innerHTML = `<text x="27" y="10.2" text-anchor="middle" font-family="Orbitron, sans-serif" font-size="8" fill="#b5bac3">12:41</text>`;
  }
  requestAnimationFrame(frame);
}

/* ---------------- controls ---------------- */
function seg(el, labels, key, steps) {
  el.innerHTML = labels.map((l, i) => `<button type="button" data-i="${i}" aria-label="${steps ? key + ' ' + i : l}">${steps ? '' : l}</button>`).join('');
  el.onclick = e => { const b = e.target.closest('button'); if (!b) return; st[key] = +b.dataset.i; render(); };
}
function paint(el, key, steps) {
  [...el.children].forEach((b, i) => {
    b.setAttribute('aria-pressed', String(st[key] === i));
    if (steps) b.dataset.on = String(i <= st[key]);
  });
}
seg($('bright'), Array.from({ length: BRIGHT_STEPS }), 'bright', true);
seg($('speed'), Array.from({ length: SPEED_STEPS }), 'speed', true);
seg($('sideMode'), SIDE_MODES, 'sideMode', false);
seg($('sideLevel'), Array.from({ length: SIDE_STEPS }), 'sideLevel', true);
seg($('boot'), ['HOME', 'GIF'], 'boot', false);
$('boot').onclick = e => { const b = e.target.closest('button'); if (!b) return; st.boot = +b.dataset.i + 1; render(); };

$('fx').innerHTML = EFFECTS.map(e => `<button type="button" data-hw="${e[0]}"><em>${String(e[0]).padStart(2, '0')}</em>${e[1]}</button>`).join('');
$('fx').onclick = e => { const b = e.target.closest('button'); if (!b) return; st.effect = +b.dataset.hw; render(); };
$('color').innerHTML = COLORS.map(([n, c], i) => `<button type="button" data-i="${i}" style="--c:${c}" aria-label="${n}"><i></i></button>`).join('') +
  `<button type="button" data-i="7" class="rb" aria-label="Rainbow"><i></i></button>`;
$('color').onclick = e => { const b = e.target.closest('button'); if (!b) return; st.color = +b.dataset.i; render(); };

function render() {
  const eff = effOf(st.effect);
  [...$('fx').children].forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.hw === st.effect)));
  paint($('bright'), 'bright', true); paint($('speed'), 'speed', true); paint($('sideLevel'), 'sideLevel', true);
  paint($('sideMode'), 'sideMode', false);
  [...$('boot').children].forEach((b, i) => b.setAttribute('aria-pressed', String(st.boot === i + 1)));
  [...$('color').children].forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.i === st.color)));
  $('rowSpeed').setAttribute('aria-disabled', String(!eff[3]));
  $('rowColor').setAttribute('aria-disabled', String(!eff[4]));
  $('rowSideLevel').setAttribute('aria-disabled', String(st.sideMode === 0));
  $('figEffect').textContent = eff[1];
  $('figState').textContent = eff[2] === 'off' ? 'LIGHTS OUT' : (eff[4] ? (st.color === 7 ? 'RAINBOW' : COLORS[st.color][0].toUpperCase()) : 'EFFECT COLOURS');
  $('readout').textContent = `hw ${st.effect} · bri ${st.bright}/${BRIGHT_STEPS - 1} · spd ${st.speed}/${SPEED_STEPS - 1} · side ${st.sideMode}/${st.sideLevel}`;
}

// the toolbar button toggles the panel, like the real dropdowns
$('kbBtn').onclick = () => {
  const p = $('panel'), open = p.getAttribute('hidden-state') === 'true';
  p.setAttribute('hidden-state', String(!open)); $('kbBtn').setAttribute('aria-expanded', String(open));
};
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('panel').setAttribute('hidden-state', 'true'); $('kbBtn').setAttribute('aria-expanded', 'false'); } });

render();
requestAnimationFrame(frame);
</script>
</body>
</html>
