<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TK-421 · Lock screen</title>
<style>
  @font-face { font-family: "Geist"; src: local("Geist"), local("Geist Regular"); font-weight: 400; }
  @font-face { font-family: "Geist"; src: local("Geist Light"); font-weight: 300; }
  @font-face { font-family: "Geist"; src: local("Geist Thin"); font-weight: 200; }
  @font-face { font-family: "Geist"; src: local("Geist SemiBold"); font-weight: 600; }

  :root {
    color-scheme: dark;
    --surface: rgba(17, 20, 24, 0.88);
    --field: rgba(232, 230, 227, 0.045);
    --border: #39414d;
    --border-strong: #4a5461;
    --text: #e8e6e3;
    --muted: #9aa0aa;
    --focus: #8cc4e8;
    --danger: #f08a8a;
    --warn: #e8c27a;

    --card-w: min(400px, calc(100vw - 32px));
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --font: "Geist", ui-sans-serif, system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #0a0c0f; }
  body {
    font-family: var(--font);
    color: var(--text);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(140, 196, 232, 0.35); color: var(--text); }

  /* ---------- background ---------- */
  .bg {
    position: fixed; inset: -80px;
    background: url("wallpaper.jpg") center / cover no-repeat;
    filter: blur(0) saturate(1) brightness(1);
    transition: filter 1000ms var(--ease);
  }
  .locked .bg { filter: blur(32px) saturate(0.9) brightness(0.62); }
  .locked.revealing .bg { filter: blur(0) saturate(1) brightness(1); }
  .instant .bg { transition: none; }

  .lock-icon .shackle {
    transform-box: fill-box; transform-origin: 100% 100%;
    transition: transform 420ms var(--ease);
  }
  .lock-icon.open .shackle { transform: translateY(-2px) rotate(28deg); }

  /* ---------- card ---------- */
  .card {
    position: fixed; left: 50%; top: 50%;
    width: 72px; height: 72px;
    transform: translate(-50%, -50%) scale(0) rotate(0deg);
    border-radius: 36px;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: 0 24px 64px -12px rgba(0, 0, 0, 0.6), 0 2px 6px rgba(0, 0, 0, 0.35);
    overflow: hidden;
  }

  .lock-icon {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    color: var(--text);
  }
  .lock-icon svg { width: 28px; height: 28px; }

  .content {
    position: absolute; top: 0; left: 50%;
    width: var(--card-w);
    transform: translateX(-50%) scale(0.92);
    padding: 40px 32px 32px;
    display: flex; flex-direction: column; align-items: center;
    opacity: 0;
    pointer-events: none;
  }
  .open .content { pointer-events: auto; }

  /* ---------- clock + date ---------- */
  .clock {
    font-size: min(6rem, 11vh);
    line-height: 1;
    font-weight: 200;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
  }
  .date {
    margin-top: 14px;
    font-size: 0.8125rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- identity ---------- */
  .avatar {
    margin-top: min(36px, 4vh);
    width: min(88px, 11vh); height: min(88px, 11vh);
    border-radius: 50%;
    display: grid; place-items: center;
    background: var(--field);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .avatar svg { width: 46%; height: 46%; }
  .user { margin-top: 12px; font-size: 0.9375rem; color: var(--text); }

  /* ---------- password ---------- */
  form { width: 100%; margin-top: min(28px, 3.5vh); }
  .field {
    position: relative;
    display: flex; align-items: center; gap: 10px;
    height: 52px;
    padding: 0 8px 0 18px;
    border-radius: 26px;
    background: var(--field);
    border: 1px solid var(--border);
    color: var(--muted);
    transition: border-color 160ms var(--ease), background-color 160ms var(--ease);
  }
  .field:hover { border-color: var(--border-strong); }
  .field:focus-within {
    border-color: var(--focus);
    outline: 2px solid rgba(140, 196, 232, 0.25);
    outline-offset: 2px;
  }
  .field svg.lead { width: 18px; height: 18px; flex: none; }
  .field input {
    flex: 1; min-width: 0; height: 100%;
    background: transparent; border: 0; outline: 0;
    color: var(--text);
    caret-color: var(--focus);
    font: 400 1rem var(--font);
    letter-spacing: 0.12em;
  }
  .field input::placeholder { color: var(--muted); letter-spacing: 0; opacity: 1; }
  .field input:-webkit-autofill { -webkit-text-fill-color: var(--text); transition: background-color 9999s; }

  .go {
    flex: none; width: 36px; height: 36px;
    border-radius: 50%; border: 0; cursor: pointer;
    display: grid; place-items: center;
    background: var(--text); color: #111418;
    transform: scale(0.6); opacity: 0; pointer-events: none;
    transition: transform 200ms var(--ease), opacity 160ms var(--ease);
  }
  .go svg { width: 18px; height: 18px; }
  .has-text .go { transform: scale(1); opacity: 1; pointer-events: auto; }
  .go:hover { background: #fff; }
  .go:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .checking .go svg { display: none; }
  .checking .go::after {
    content: ""; width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid rgba(17, 20, 24, 0.25); border-top-color: #111418;
    animation: spin 700ms linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .shake { animation: shake 420ms var(--ease); }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-9px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(3px); }
  }
  .error .field { border-color: var(--danger); }

  /* ---------- state message ---------- */
  .state {
    margin-top: 14px;
    min-height: 1.25rem;
    font-size: 0.875rem;
    text-align: center;
    color: var(--muted);
  }
  .state[data-kind="error"] { color: var(--danger); }
  .state[data-kind="warn"] { color: var(--warn); }

  /* ---------- after unlock ---------- */
  .relock {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    padding: 12px 20px; border-radius: 999px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border);
    font: 400 0.9375rem var(--font);
    cursor: pointer;
    opacity: 0; pointer-events: none;
    transition: opacity 300ms var(--ease);
  }
  .relock kbd { font: inherit; color: var(--muted); }
  .relock:hover { border-color: var(--border-strong); }
  .relock:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .unlocked .relock { opacity: 1; pointer-events: auto; }

  .hint {
    position: fixed; left: 16px; right: 16px; bottom: 14px;
    text-align: center;
    font-size: 0.75rem; color: rgba(232, 230, 227, 0.62);
  }
  .hint kbd { font: inherit; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .bg, .field, .go, .relock { transition-duration: 1ms; }
    .shake { animation: none; }
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true"></div>

<section class="card" id="card" aria-label="Tela de bloqueio">
  <div class="lock-icon" id="lockIcon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path class="shackle" d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
  </div>

  <div class="content" id="content">
    <div class="clock" id="clock">00:00</div>
    <div class="date" id="date"></div>

    <div class="avatar" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.75"/><path d="M4.5 20c.9-3.6 3.9-5.5 7.5-5.5s6.6 1.9 7.5 5.5"/></svg>
    </div>
    <div class="user">tk421</div>

    <form id="form" autocomplete="off">
      <div class="field" id="field">
        <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
        <input id="pw" type="password" placeholder="Senha" aria-label="Senha" autocomplete="current-password" spellcheck="false">
        <button class="go" id="go" type="submit" aria-label="Desbloquear">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
      <p class="state" id="state" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>

<button class="relock" id="relock" type="button">Bloquear · <kbd>L</kbd></button>

<p class="hint">Protótipo · senha de teste <kbd>Senha123</kbd> · <kbd>L</kbd> bloqueia de novo</p>

<script>
(() => {
  if (location.hash === '#instant') document.documentElement.classList.add('instant');
  const $ = id => document.getElementById(id);
  const body = document.body, card = $('card'), content = $('content'), lockIcon = $('lockIcon');
  const pw = $('pw'), field = $('field'), form = $('form'), state = $('state');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches || location.hash === '#instant';
  const EASE = 'cubic-bezier(0.16, 1, 0.3, 1)';
  const D = reduce ? 1 : 1;               // keep timings declarative below
  const t = ms => reduce ? 1 : ms;

  let busy = false, capsOn = false;

  /* ---- clock + date (pt-BR) ---- */
  function tick() {
    const n = new Date();
    $('clock').textContent = n.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    const wd = n.toLocaleDateString('pt-BR', { weekday: 'long' });
    const day = n.getDate();
    const mon = n.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '');
    $('date').textContent = `${wd} • ${day} ${mon}`;
  }
  tick(); setInterval(tick, 1000);

  /* ---- state message ---- */
  function say(text, kind = '') { state.textContent = text; state.dataset.kind = kind; }
  function idleMessage() { capsOn ? say('Caps Lock ativado', 'warn') : say(''); }

  /* ---- natural size of the open card ---- */
  const openSize = () => {
    const w = Math.min(400, innerWidth - 32);
    return { w, h: content.offsetHeight };
  };

  /* ---- lock: icon pops in, then card grows into the form (Caelestia-style) ---- */
  async function lock() {
    body.className = 'locked';
    busy = true;
    pw.value = ''; pw.disabled = false;
    field.parentElement.classList.remove('has-text', 'checking', 'error');
    say('');
    const { w, h } = openSize();

    if (location.hash === '#instant') {      // final state, synchronously (screenshots / tests)
      Object.assign(card.style, { width: w + 'px', height: h + 'px', transform: 'translate(-50%,-50%)', borderRadius: '36px' });
      Object.assign(content.style, { opacity: 1, transform: 'translateX(-50%)' });
      lockIcon.style.opacity = 0;
      body.classList.add('open'); busy = false;
      return;
    }

    [card, content, lockIcon].forEach(el => el.getAnimations().forEach(a => a.cancel()));
    lockIcon.classList.remove('open');
    card.style.cssText = '';
    await card.animate(
      [{ transform: 'translate(-50%,-50%) scale(0) rotate(0deg)' },
       { transform: 'translate(-50%,-50%) scale(1) rotate(360deg)' }],
      { duration: t(650), easing: EASE, fill: 'forwards' }).finished;

    card.style.width = '72px'; card.style.height = '72px';
    const grow = card.animate(
      [{ width: '72px', height: '72px', borderRadius: '36px', transform: 'translate(-50%,-50%) scale(1) rotate(360deg)' },
       { width: w + 'px', height: h + 'px', borderRadius: '36px', transform: 'translate(-50%,-50%) scale(1) rotate(360deg)' }],
      { duration: t(700), easing: EASE, fill: 'forwards' });
    lockIcon.animate([{ opacity: 1, transform: 'rotate(0)' }, { opacity: 0, transform: 'rotate(-90deg)' }],
      { duration: t(300), easing: EASE, fill: 'forwards' });
    content.animate([{ opacity: 0, transform: 'translateX(-50%) scale(0.92)' }, { opacity: 1, transform: 'translateX(-50%) scale(1)' }],
      { duration: t(500), delay: t(220), easing: EASE, fill: 'forwards' });
    await grow.finished;

    card.style.width = w + 'px'; card.style.height = h + 'px'; card.style.borderRadius = '36px';
    body.classList.add('open');
    busy = false;
    pw.focus();
  }

  /* ---- unlock: reverse of the above, then fade the background ---- */
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  async function unlock() {
    body.classList.remove('open');
    body.classList.add('revealing');          // wallpaper sharpens while the card collapses
    const { w, h } = openSize();
    content.animate([{ opacity: 1, transform: 'translateX(-50%) scale(1)' }, { opacity: 0, transform: 'translateX(-50%) scale(0.92)' }],
      { duration: t(260), easing: EASE, fill: 'forwards' });
    lockIcon.animate([{ opacity: 0, transform: 'rotate(-90deg)' }, { opacity: 1, transform: 'rotate(0)' }],
      { duration: t(320), delay: t(240), easing: EASE, fill: 'forwards' });
    setTimeout(() => lockIcon.classList.add('open'), t(420));   // shackle pops open
    await card.animate(
      [{ width: w + 'px', height: h + 'px' }, { width: '72px', height: '72px' }],
      { duration: t(560), delay: t(100), easing: EASE, fill: 'forwards' }).finished;
    await sleep(t(380));                      // let the open padlock read
    await card.animate(
      [{ opacity: 1, transform: 'translate(-50%,-50%) scale(1) rotate(360deg)' },
       { opacity: 0, transform: 'translate(-50%,-50%) scale(0.6) rotate(360deg)' }],
      { duration: t(380), easing: EASE, fill: 'forwards' }).finished;
    body.className = 'unlocked';
    $('relock').focus();
  }

  /* ---- mock authentication ---- */
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (busy || !pw.value) return;
    busy = true;
    form.classList.add('checking');
    say('Verificando…');
    await new Promise(r => setTimeout(r, reduce ? 1 : 650));
    form.classList.remove('checking');

    if (pw.value === 'Senha123') {
      say('');
      await unlock();
    } else {
      form.classList.add('error');
      say('Senha incorreta. Tente de novo.', 'error');
      field.classList.remove('shake'); void field.offsetWidth; field.classList.add('shake');
      pw.value = ''; form.classList.remove('has-text');
      busy = false; pw.focus();
    }
  });

  pw.addEventListener('input', () => {
    form.classList.toggle('has-text', pw.value.length > 0);
    if (form.classList.contains('error')) { form.classList.remove('error'); idleMessage(); }
  });

  const syncCaps = e => {
    if (!e.getModifierState) return;
    capsOn = e.getModifierState('CapsLock');
    if (!form.classList.contains('error') && !form.classList.contains('checking')) idleMessage();
  };
  addEventListener('keydown', syncCaps); addEventListener('keyup', syncCaps);

  $('relock').addEventListener('click', lock);
  addEventListener('keydown', e => {
    if (e.key.toLowerCase() !== 'l' || e.ctrlKey || e.metaKey || e.altKey) return;
    if (body.classList.contains('unlocked')) lock();   // typing "l" in the password field is untouched: the card is hidden then
  });
  addEventListener('resize', () => {
    if (!body.classList.contains('open')) return;
    const { w, h } = openSize(); card.style.width = w + 'px'; card.style.height = h + 'px';
  });

  if (location.hash === '#instant') lock(); else document.fonts.ready.then(lock);
})();
</script>
</body>
</html>
