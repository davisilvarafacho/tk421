; cava for the desktop Audio widget (widgets/AudioWidget.qml): raw ascii output, one frame per line,
; 48 bands as numbers 0-1000 separated by ";". Run as `cava -p widgets/cava.conf`.
[general]
bars = 48
framerate = 60
autosens = 1

[input]
method = pipewire
source = auto

[output]
method = raw
channels = mono
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 70
